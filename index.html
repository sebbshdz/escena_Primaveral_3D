<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escena Primaveral 3D</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #cfeaff;
      }

      #contenedor {
        position: fixed;
        inset: 0;
      }

      #contenedor canvas {
        display: block;
        touch-action: none;
      }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 270px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(6px);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
        color: #2d3a2e;
      }

      #panel h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      #panel button {
        width: 100%;
        margin-bottom: 8px;
        padding: 8px 10px;
        border: none;
        border-radius: 8px;
        background: #4caf50;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
      }

      #panel button:hover {
        background: #43a047;
      }

      #panel label {
        display: block;
        margin-top: 6px;
        font-size: 13px;
      }

      #panel input[type="range"] {
        width: 100%;
      }

      #ayuda {
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.4;
        color: #55645a;
      }
    </style>
  </head>
  <body>
    <div id="contenedor"></div>

    <div id="panel">
      <h1>🌸 Primavera 3D</h1>
      <button id="btnSonido">🔇 Sonido: apagado</button>
      <button id="btnDia">⏸ Pausar el día</button>
      <label>
        Hora del día: <strong id="etiquetaHora">Mañana</strong>
        <input id="rangoHora" type="range" min="6" max="94" value="10">
      </label>
      <label>
        Viento
        <input id="rangoViento" type="range" min="0" max="100" value="50">
      </label>
      <p id="ayuda">
        Arrastra para mover la cámara, usa la rueda para acercar y haz clic en el pasto para plantar flores.
      </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="funciona.js"></script>
  </body>
</html>
